name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------------------------------------------------------------------------
  backend:
    name: Backend · unit + integración + coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Base_Datos_StyleB
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Base_Datos_StyleB/package-lock.json

      # mongodb-memory-server descarga el binario de mongod (~100 MB) la primera
      # vez; se cachea para que las siguientes ejecuciones no lo vuelvan a bajar.
      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      - name: Install dependencies
        run: npm ci

      # test:coverage corre unit + integración y aplica el trinquete de cobertura
      # (falla si baja de los umbrales de vitest.config.js).
      - name: Unit + integración + coverage (ratchet)
        run: npm run test:coverage

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: Base_Datos_StyleB/coverage
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  frontend-unit:
    name: Frontend · unit + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Style-Busters-main
    # Blindaje defensivo: vitest.config.js ya provee REACT_APP_API_URL vía
    # test.env para los tests, y el build (CRA/webpack) no ejecuta apiClient.js
    # en tiempo de build (solo lo bundlea). Se fija igualmente a nivel de job
    # por si el comportamiento del bundler cambiara a futuro.
    env:
      REACT_APP_API_URL: http://localhost:4000/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Style-Busters-main/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: Style-Busters-main/coverage
          if-no-files-found: ignore

      - name: Build
        # CI=false: no tratar warnings de ESLint como errores (sí fallan los tests).
        run: CI=false npm run build

  # ---------------------------------------------------------------------------
  e2e:
    name: E2E · Cypress
    runs-on: ubuntu-latest
    # E2E solo corre si las unidades e integración (backend y frontend) pasan:
    # así el pipeline se detiene antes de gastar en E2E si algo crítico falla.
    needs: [backend, frontend-unit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('Style-Busters-main/package-lock.json') }}

      - name: Install frontend dependencies
        working-directory: Style-Busters-main
        run: npm ci --legacy-peer-deps

      - name: Install backend dependencies
        working-directory: Base_Datos_StyleB
        run: npm ci

      - name: Run E2E (backend efímero + CRA + Cypress headless)
        working-directory: Style-Busters-main
        # En CI (Linux) se usa Electron headless, que sí arranca correctamente.
        run: npm run e2e:ci:headless

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            Style-Busters-main/cypress/videos
            Style-Busters-main/cypress/screenshots
          if-no-files-found: ignore
